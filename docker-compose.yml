services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Semantic search over RAG corpus (documents/events). Port 8001.
  rag_adhoc:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - "uvicorn"
      - "apps.rag_adhoc.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      RAG_ADHOC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic}
      RAG_ADHOC_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_ADHOC_API_KEY: ${RAG_ADHOC_API_KEY:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8000"
    depends_on:
      postgres: {condition: service_healthy}

  # Claude Code CLI behind FastAPI. Port 8002.
  # Auth: mount a host directory holding `claude auth login` state to /home/app/.claude
  # (default Claude config dir). For Pro/subscription, run `claude auth login` once
  # on the host into ./claude_home, then it persists into the container.
  claude_agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.claude_agent
    env_file:
      # Host-specific files. `required: false` so a laptop without them still
      # boots — /etc/claude-worker.env only exists on the VPS, and the root .env
      # only where postgres credentials are overridden.
      - path: .env
        required: false
      - path: apps/claude_agent/.env
        required: false
      - path: /etc/claude-worker.env
        required: false
    environment:
      CLAUDE_AGENT_WORKSPACE_DIR: /workspace/claude_agent_fe
      CLAUDE_AGENT_LOG_LEVEL: ${CLAUDE_AGENT_LOG_LEVEL:-INFO}
      # CLAUDE_AGENT_API_KEY is deliberately NOT listed here. `environment:`
      # overrides `env_file:`, so `${CLAUDE_AGENT_API_KEY:-}` silently replaced
      # the key from apps/claude_agent/.env with "" whenever the root .env did
      # not define it — and an empty key plus the default service-key bypass
      # makes the whole topic API readable without credentials. Let env_file own
      # it; to override per host, set it in apps/claude_agent/.env.
      CLAUDE_AGENT_DEFAULT_MODEL: ${CLAUDE_AGENT_DEFAULT_MODEL:-}
      CLAUDE_AGENT_ALLOW_FREEFORM_PROMPTS: ${CLAUDE_AGENT_ALLOW_FREEFORM_PROMPTS:-false}
      CLAUDE_AGENT_STATE_DIR: ${CLAUDE_AGENT_STATE_DIR:-/state}
      CLAUDE_AGENT_SCHEMA_VERSION: ${CLAUDE_AGENT_SCHEMA_VERSION:-0.2.0}
      CLAUDE_AGENT_ENV_VERSION: ${CLAUDE_AGENT_ENV_VERSION:-1}
      CLAUDE_AGENT_DATABASE_URL: ${CLAUDE_AGENT_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic}}
      # SignalGather UI (#16) baked into the image; served at /app on this port.
      # Set empty to disable the mount. CORS is only needed when the UI is served
      # elsewhere (e.g. `npm run dev` without the proxy).
      CLAUDE_AGENT_WEB_DIST: ${CLAUDE_AGENT_WEB_DIST-/app/web}
      CLAUDE_AGENT_CORS_ORIGINS: ${CLAUDE_AGENT_CORS_ORIGINS-}
      HOME: /home/app
    volumes:
      - ./claude_agent_fe:/workspace/claude_agent_fe:rw
      - ${CLAUDE_HOME_DIR:-./claude_home}:/home/app/.claude:rw
      - ${CLAUDE_STATE_DIR:-./state}:/state:rw
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8002:8002"

volumes:
  postgres_data:
